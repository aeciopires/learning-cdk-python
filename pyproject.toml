[project]
name = "learning-cdk-python"
version = "0.1.0"
description = "A beginner learning path for AWS CDK with Python, deployed locally against the floci AWS emulator."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
dependencies = [
    "aws-cdk-lib==2.271.0",
    "constructs>=10.8.1,<11.0.0",
    "boto3>=1.40.0",
    "aws-cdk-lambda-layer-kubectl-v36>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.14.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "modules"]
