[project]
name = "learning-cdk-python"
version = "0.1.0"
description = "A beginner learning path for AWS CDK with Python, deployed locally against the floci AWS emulator."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
dependencies = [
    "aws-cdk-lib==2.271.0",
    "constructs>=10.8.1,<11.0.0",
    "boto3>=1.40.0",
    "aws-cdk-lambda-layer-kubectl-v36>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.14.0",
    "ruff>=0.9.0",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Test coverage (`make coverage`) - see docs/TESTING.md, "Test coverage".
[tool.coverage.run]
# Branch coverage: an `if` counts as covered only when both its "true" and
# "false" paths have run, not just its first line.
branch = true
source = ["app", "shared", "modules", "examples", "scripts"]
omit = ["*/tests/*", "tests/*"]

[tool.coverage.report]
# The minimum accepted total - `make coverage` fails below it. The goal is
# 100% wherever possible; see docs/TESTING.md for what counts as "not possible".
fail_under = 80
show_missing = true
skip_covered = false
# Lines that can never run under a test runner, excluded on purpose (each
# is a regular expression matched against a source line).
exclude_also = [
    'if __name__ == .__main__.:',   # only runs as `python file.py`, never on import
    'raise NotImplementedError',     # the body of an abstract method
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "modules"]
